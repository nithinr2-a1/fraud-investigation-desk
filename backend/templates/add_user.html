{% extends "base.html" %}

{% block title %}
Add User
{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <div>

        <h1 class="fw-bold mb-1">
            Add User
        </h1>

        <p class="text-muted mb-0">
            Create a new Fraud Desk investigation user
        </p>

    </div>

    <a
        href="{{ url_for('users.users_list') }}"
        class="btn btn-outline-secondary"
    >
        <i class="bi bi-arrow-left me-2"></i>
        Back to Users
    </a>

</div>


<div class="card border-0 shadow-sm">

    <div class="card-body p-4 p-lg-5">

        <div class="d-flex align-items-center mb-4">

            <div
                class="rounded-3 p-3 me-3"
                style="
                    background:#e8f0ff;
                    color:#2563eb;
                "
            >
                <i class="bi bi-person-plus fs-4"></i>
            </div>

            <div>

                <h4 class="fw-bold mb-1">
                    User Information
                </h4>

                <p class="text-muted mb-0">
                    Enter the user's account and access details.
                </p>

            </div>

        </div>


        <form method="POST">

            <div class="row g-4">

                <!-- Username -->

                <div class="col-md-6">

                    <label class="form-label fw-semibold">
                        Username
                    </label>

                    <input
                        type="text"
                        name="username"
                        class="form-control form-control-lg"
                        placeholder="Enter username"
                        required
                    >

                </div>


                <!-- Full Name -->

                <div class="col-md-6">

                    <label class="form-label fw-semibold">
                        Full Name
                    </label>

                    <input
                        type="text"
                        name="name"
                        class="form-control form-control-lg"
                        placeholder="Enter full name"
                    >

                </div>


                <!-- Email -->

                <div class="col-md-6">

                    <label class="form-label fw-semibold">
                        Email Address
                    </label>

                    <input
                        type="email"
                        name="email"
                        class="form-control form-control-lg"
                        placeholder="Enter email address"
                    >

                </div>


                <!-- Role -->

                <div class="col-md-6">

                    <label class="form-label fw-semibold">
                        Role
                    </label>

                    <select
                        name="role"
                        class="form-select form-select-lg"
                    >

                        <option value="Investigator">
                            Investigator
                        </option>

                        <option value="Admin">
                            Admin
                        </option>

                    </select>

                </div>


                <!-- Password -->

                <div class="col-md-6">

                    <label class="form-label fw-semibold">
                        Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        class="form-control form-control-lg"
                        placeholder="Enter password"
                        minlength="6"
                        required
                    >

                    <small class="text-muted">
                        Minimum 6 characters.
                    </small>

                </div>


            </div>


            <hr class="my-5">


            <div class="d-flex justify-content-end gap-2">

                <a
                    href="{{ url_for('users.users_list') }}"
                    class="btn btn-light border px-4"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="btn btn-primary px-4"
                >

                    <i class="bi bi-person-plus me-2"></i>
                    Create User

                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
