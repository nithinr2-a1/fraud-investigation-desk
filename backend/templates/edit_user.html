{% extends "base.html" %}

{% block title %}
Edit User
{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <div>

        <h1 class="fw-bold mb-1">
            Edit User
        </h1>

        <p class="text-muted mb-0">
            Update user account and access information
        </p>

    </div>

    <a
        href="{{ url_for('users.users_list') }}"
        class="btn btn-outline-secondary"
    >

        <i class="bi bi-arrow-left me-2"></i>
        Back to Users

    </a>

</div>


<div class="card border-0 shadow-sm">

    <div class="card-body p-4 p-lg-5">

        <div class="d-flex align-items-center mb-4">

            <div
                class="rounded-3 p-3 me-3"
                style="
                    background:#fff3df;
                    color:#f59e0b;
                "
            >

                <i class="bi bi-person-gear fs-4"></i>

            </div>

            <div>

                <h4 class="fw-bold mb-1">
                    User Information
                </h4>

                <p class="text-muted mb-0">
                    Update the selected user's details.
                </p>

            </div>

        </div>


        <form method="POST">

            <div class="row g-4">

                <!-- Username -->

                <div class="col-md-6">

                    <label class="form-label fw-semibold">
                        Username
                    </label>

                    <input
                        type="text"
                        name="username"
                        class="form-control form-control-lg"
                        value="{{ user.get('username', '') }}"
                        required
                    >

                </div>


                <!-- Full Name -->

                <div class="col-md-6">

                    <label class="form-label fw-semibold">
                        Full Name
                    </label>

                    <input
                        type="text"
                        name="name"
                        class="form-control form-control-lg"
                        value="{{ user.get('name', '') }}"
                    >

                </div>


                <!-- Email -->

                <div class="col-md-6">

                    <label class="form-label fw-semibold">
                        Email Address
                    </label>

                    <input
                        type="email"
                        name="email"
                        class="form-control form-control-lg"
                        value="{{ user.get('email', '') }}"
                    >

                </div>


                <!-- Role -->

                <div class="col-md-6">

                    <label class="form-label fw-semibold">
                        Role
                    </label>

                    <select
                        name="role"
                        class="form-select form-select-lg"
                    >

                        <option
                            value="Investigator"
                            {% if user.get("role") == "Investigator" %}
                                selected
                            {% endif %}
                        >
                            Investigator
                        </option>

                        <option
                            value="Admin"
                            {% if user.get("role") == "Admin" %}
                                selected
                            {% endif %}
                        >
                            Admin
                        </option>

                    </select>

                </div>


                <!-- Status -->

                <div class="col-md-6">

                    <label class="form-label fw-semibold">
                        Status
                    </label>

                    <select
                        name="status"
                        class="form-select form-select-lg"
                    >

                        <option
                            value="Active"
                            {% if user.get("status", "Active") == "Active" %}
                                selected
                            {% endif %}
                        >
                            Active
                        </option>

                        <option
                            value="Inactive"
                            {% if user.get("status") == "Inactive" %}
                                selected
                            {% endif %}
                        >
                            Inactive
                        </option>

                    </select>

                </div>


                <!-- Password -->

                <div class="col-md-6">

                    <label class="form-label fw-semibold">
                        New Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        class="form-control form-control-lg"
                        placeholder="Leave blank to keep current password"
                        minlength="6"
                    >

                    <small class="text-muted">
                        Leave blank if you do not want to change the password.
                    </small>

                </div>

            </div>


            <hr class="my-5">


            <div class="d-flex justify-content-end gap-2">

                <a
                    href="{{ url_for('users.users_list') }}"
                    class="btn btn-light border px-4"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="btn btn-warning px-4"
                >

                    <i class="bi bi-check2-circle me-2"></i>
                    Save Changes

                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
