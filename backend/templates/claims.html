{% extends "base.html" %}

{% block title %}
Claims
{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <h2>Claims</h2>

<a href="{{ url_for('claims.add_claim') }}" class="btn btn-primary">
    + Add Claim
</a>

</div>

<table class="table table-striped table-hover">

<thead>

<tr>

<th>Claim ID</th>

<th>Type</th>

<th>Amount</th>

<th>Status</th>

<th>Actions</th>

</tr>

</thead>

<tbody>

{% for claim in claims %}

<tr>

<td>{{ claim.claim_id }}</td>

<td>{{ claim.claim_type }}</td>

<td>₹ {{ claim.claim_amount }}</td>

<td>{{ claim.status }}</td>

<td>

<a
href="{{ url_for('claims.view_claim', claim_id=claim._id) }}"
class="btn btn-info">

View

<button class="btn btn-sm btn-warning">
Edit
</button>

<button class="btn btn-sm btn-danger">
Delete
</button>

</td>

</tr>

{% endfor %}

</tbody>

</table>

{% endblock %}
