<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fraud Investigation Desk - Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background:#f4f6f9;
}

.login-card{
    max-width:420px;
    margin:90px auto;
    padding:35px;
    border-radius:12px;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
    background:white;
}

.logo{
    font-size:32px;
}

.title{
    font-weight:bold;
    color:#16345b;
}

.subtitle{
    color:#777;
    font-size:14px;
}
</style>

</head>

<body>

<div class="container">

<div class="login-card">

<div class="text-center mb-4">

<div class="logo">🛡️</div>

<h2 class="title">
Fraud Investigation Desk
</h2>

<p class="subtitle">
Secure Login
</p>

</div>

<form method="POST">

<div class="mb-3">

<label class="form-label">
Username
</label>

<input
type="text"
name="username"
class="form-control"
placeholder="Enter Username"
required>

</div>

<div class="mb-3">

<label class="form-label">
Password
</label>

<input
type="password"
name="password"
class="form-control"
placeholder="Enter Password"
required>

</div>

<div class="d-grid">

<button class="btn btn-primary btn-lg">
Login
</button>

</div>

</form>

</div>

</div>

</body>
</html>
